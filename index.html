<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To do List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="todo-list">
      <h1>To do list</h1>
      <div class="type-todo">
        <input type="text" class="text-type"  id="text-type" maxlength="25"/>
        <button class="add-btn" id="add-btn">Add</button>
      </div>
      <div class="place">
        <div class="place1">
          <ol id="list"></ol>
        </div>
        <div class="place2">
        </div>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
